<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>My Simple Webpage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        main {
            padding: 20px;
            text-align: center;
        }
        footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: absolute;
            width: 100%;
            bottom: 0;
        }
        img {
            width: 300px; /* Adjust the width as per your needs */
            height: 300px;
            max-width: 600px;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Simple Webpage</h1>
</header>

<main>
    <p>This is a basic example of a webpage created with HTML and CSS. You can add more content here!</p>
    <p>Feel free to modify the code and explore how HTML and CSS work together.</p>

    <!-- Image added below -->
    <img src="images/html.png" alt="Placeholder Image">

</main>

<footer>
    <p>&copy; 2025 My Simple Webpage</p>
</footer>

</body>
</html>
